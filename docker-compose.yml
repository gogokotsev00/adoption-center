services:
  postgres:
    image: postgres:18
    container_name: adoption_postgres
    restart: on-failure
    environment:
      POSTGRES_DB: adoption_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d adoption_center -U adoption_user" ]
      timeout: 20s
      start_period: 15s
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: spring-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: angular-frontend
    restart: on-failure
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/src
      - /src/node_modules

volumes:
  postgres_data:
